name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # The sitemap's lastmod and the pages' dateModified come from commit
        # history, so the build needs more than the default shallow clone.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with Astro
        # Pinned to a SHA, not the v3 tag: this is the one action here that
        # GitHub does not own, and a tag is a moving ref its author can
        # repoint at any commit. Bump deliberately, not silently.
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3.0.2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell the IndexNow engines the site changed rather than waiting to be
  # crawled. Bing, Yandex, Seznam and Naver share this endpoint, and Bing is
  # the index ChatGPT and Copilot lean on, so this is the shortest path from
  # "deployed" to "an AI can find it". Google does not participate.
  #
  # Runs after the deploy so the URLs it submits are actually live, and reads
  # the published sitemap rather than a build artifact, which keeps this job
  # independent of the other two.
  ping-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow
        env:
          HOST: rmtdco.com
          KEY: daa9496b9447dd5f98ede9e23b18de12
        run: |
          set -euo pipefail
          # Give the CDN a moment to serve the new build before announcing it.
          sleep 30
          # No --fail, and no exit 1 below. The deploy has already succeeded
          # by the time this runs, so nothing here should be able to turn the
          # run red. A missing sitemap means the domain is not attached yet,
          # which is worth a warning and nothing more.
          sitemap=$(curl -sS --retry 3 "https://${HOST}/sitemap-0.xml" || true)
          # Extract first, test for emptiness as a string, and only then build
          # JSON. Doing the emptiness check inside the pipeline meant a failing
          # grep fired `|| echo []` on top of output jq had already produced,
          # so count came out as two values and the integer test broke.
          locs=$(printf '%s' "$sitemap" | grep -o '<loc>[^<]*</loc>' | sed 's|</\?loc>||g' || true)
          if [ -z "$locs" ]; then
            echo "::warning::No URLs at https://${HOST}/sitemap-0.xml; skipping IndexNow."
            exit 0
          fi
          urls=$(printf '%s' "$locs" | jq -R . | jq -s .)
          count=$(printf '%s' "$urls" | jq 'length')
          echo "Submitting $count URLs to IndexNow."
          payload=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg loc "https://${HOST}/${KEY}.txt" \
            --argjson urlList "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urlList}')
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload")
          echo "IndexNow responded $code"
          cat /tmp/indexnow.out || true
          # 200 accepted, 202 accepted but key still being validated.
          case "$code" in
            200|202) exit 0 ;;
            # A submission problem should not fail a deploy that already
            # succeeded; surface it and move on.
            *) echo "::warning::IndexNow submission returned $code"; exit 0 ;;
          esac
